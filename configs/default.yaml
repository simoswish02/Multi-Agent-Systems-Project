env:
  grid_size: 32              # single source of truth — fixed map size
  obstacle_density: 0.2
  n_agents: 3
  vision_radius: 3
  comm_range: 5
  comm_metric: "manhattan"
  max_steps: 300
  step_penalty: -0.3
  wall_penalty: -0.02
  revisit_penalty: -0.05
  target_reward: 200.0
  exploration_bonus: 0.02
  collision_penalty: -0.5    # penalty per overlapping drone on the same cell
  # Cooperative credit assignment for the terminal target reward.
  #   false -> only the drone that reaches the target gets target_reward
  #   true  -> the whole team gets target_reward on its last transition
  #            (requires agent.n_step >= 2). Toggle to A/B the two variants.
  shared_target_reward: true
  seed: 42

# Domain randomisation ranges (sampled uniformly each episode).
# Set min == max to fix a parameter.
# grid_size is not randomised — all maps are always grid_size x grid_size.
domain_randomization:
  vision_radius: [1, 6]      # normalisation denom: 6  (max)
  comm_range:    [2, 12]     # normalisation denom: 12 (max)
  n_agents:      [1, 4]      # normalisation denom: 4  (max)

curriculum:
  - name: "test"
    n_episodes: 0
    n_agents: 3
    obstacle_density: 0.20
    max_steps: 200
    epsilon_reset: 0.5
    dr_override:
      vision_radius: [2, 5]
      comm_range:    [3, 10]
      n_agents:      [1, 3]

  - name: "phase0_ConvNeXT_dr"
    n_episodes: 0
    n_agents: 4
    obstacle_density: 0.20
    max_steps: 200

  - name: "phase1_ConvNeXT_continue_dr"
    n_episodes: 0
    n_agents: 4
    obstacle_density: 0.20
    max_steps: 200
    epsilon_reset: 0.2

  - name: "phase2_ConvNeXT_10k_dr"
    n_episodes: 10000
    n_agents: 4
    obstacle_density: 0.20
    max_steps: 200

agent:
  lr: 0.0001
  weight_decay: 0.000001
  grad_clip: 1

  lr_scheduler:
    use_episode_scheduler: true   # stepped once per episode, not per gradient update
    max_lr: 0.0005                # peak LR reached at end of warmup
    min_lr: 1.0e-6                # floor LR at the end of cosine annealing
    warmup_pct: 0.1              # fraction of total episodes used for linear warmup

  gamma: 0.97              # raised from 0.95: longer effective horizon for search
  n_step: 3                # n-step returns (1 = standard one-step TD)
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.999
  batch_size: 16
  buffer_size: 200000
  target_update_freq: 500

  fc_hidden: 1536           # FC head: combined(1024+384+3) -> 1536 -> 768 -> 384

training:
  update_every: 4
  eval_every: 100
  eval_episodes: 20
  eval_epsilon: 0.05
  save_every: 200
  log_dir: "runs/"
  checkpoint_dir: "checkpoints/Phase3"

  # Parallel evaluation during training. When true, train.py auto-spawns
  # `eval_checkpoints.py --watch` as a separate process: it evaluates every
  # periodic checkpoint as soon as it is written (with domain randomisation,
  # fixed per-seed -> comparable instances), appends results to
  # eval_results/watch_summary.csv incrementally, and prints/saves the final
  # ranking when training finishes. Output goes to eval_results/parallel_eval.log.
  eval_during_training: true
  eval_during_training_device: cuda     # cpu | cuda (cuda is faster but shares VRAM)
  eval_during_training_episodes: 200    # greedy episodes per checkpoint
